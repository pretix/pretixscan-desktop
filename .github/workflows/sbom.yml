name: SBOM

on:
  push:
    branches: [ master, main, sbom ]
    tags: [ 'v.*' ]

permissions:
  contents: read  #  to fetch code (actions/checkout)

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ubuntu-latest
    name: Submission
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: "23"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Gradle build
        working-directory: ./pretixscan
        run: ./gradlew cyclonedxBom
      - name: Install Python dependencies
        run: pip3 install -U "prisma-sbom-submit"
      - name: Submit SBOM
        run: prisma-sbom-submit upload --server https://prisma.pretix.com pretixscan/composeApp/build/reports/cyclonedx/bom.json
        env:
          PRISMA_UPLOAD_TOKEN: ${{ secrets.PRISMA_UPLOAD_TOKEN }}
